repos:
  # General hygiene
  - repo: builtin
    hooks:
      - id: check-merge-conflict
      - id: check-toml
      - id: check-yaml
      - id: check-json
      - id: pretty-format-json
        args: [--autofix, --indent, "2"]
        exclude: ^frontend/
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: no-commit-to-branch
        args: [--branch, main]
      - id: detect-private-key

  # Security
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.24.0
    hooks:
      - id: gitleaks                    # detect hardcoded secrets

  # Go
  - repo: local
    hooks:
    - id: gofmt
      name: gofmt
      language: system
      entry: gofmt -s -w
      types: [go]

    - id: go-vet
      name: go vet
      language: system
      entry: go vet ./...
      types: [go]
      pass_filenames: false

    - id: go-mod-tidy
      name: go mod tidy
      language: system
      entry: go mod tidy
      files: \.go$|^go\.(mod|sum)$
      pass_filenames: false

    - id: golangci-lint
      name: golangci-lint
      language: system
      entry: golangci-lint run
      types: [go]
      pass_filenames: false
